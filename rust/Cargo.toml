[package]
name = "ilspy-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A small, conservative CIL-to-C#-like decompiler"
# One test target for every suite: a library change relinks one binary, not one
# per file, and the suites stay selectable by test name.
autotests = false

[dependencies]
cildec = "=0.1.0"
sha1 = "=0.10.7"
serde_json = "=1.0.154"

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "discovery_paths"
path = "tests/discovery_paths.rs"

[[test]]
name = "signature_guard"
path = "tests/signature_guard.rs"

[profile.release]
strip = true
lto = "thin"
